name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Ejecutar diagnóstico sin red
        # Informativo: el runner puede tener poco disco libre y eso no es un error del código.
        continue-on-error: true
        run: node dist/cli.js --sin-red
